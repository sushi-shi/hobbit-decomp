# Gruntz ownership/profile contract; hypothesis rationale: docs/first-structure.md.
# Reconstructed and provisional imported translation units; evidence inventory is separate.
[build]
compiler = "msvc6.0"
platform = "win32"
msvc_compat = "12.00"

[flags]
cpp = ["/nologo", "/c", "/O2", "/G6", "/MT", "/GX", "/GR", "/DWIN32", "/D_WINDOWS", "/DTARGET_PC"]

# Guid: PC packed user/process/time generator and pooled literal storage.
# Unit-local /DX_EDITOR branch; evidence: docs/imports/cohort14-guid-pc.json.
cpp-guid-editor = ["/nologo", "/c", "/O2", "/G6", "/MT", "/GX", "/GR", "/DWIN32", "/D_WINDOWS", "/DTARGET_PC", "/DX_EDITOR"]

cpp-unpooled = ["/nologo", "/c", "/Og", "/Oi", "/Ot", "/Oy", "/Ob1", "/Gs", "/Gy", "/G6", "/MT", "/GX", "/GR", "/DWIN32", "/D_WINDOWS", "/DTARGET_PC"]

# fx_Ctrl: all three original bodies and references match /G5; /G6 differs.
# Evidence: config/evidence/fx-ctrl.json.
cpp-unpooled-g5 = ["/nologo", "/c", "/Og", "/Oi", "/Ot", "/Oy", "/Ob1", "/Gs", "/Gy", "/G5", "/MT", "/GX", "/GR", "/DWIN32", "/D_WINDOWS", "/DTARGET_PC"]

# Original key-controller TUs have one-slot vtables without RTTI; /G6 and /GR
# controls differ. Evidence: config/evidence/fx-key-controllers.json.
cpp-unpooled-g5-no-rtti = ["/nologo", "/c", "/Og", "/Oi", "/Ot", "/Oy", "/Ob1", "/Gs", "/Gy", "/G5", "/MT", "/GX", "/GR-", "/DWIN32", "/D_WINDOWS", "/DTARGET_PC"]

# Provisional C provider build profile; original per-TU settings await polish.
c-import = ["/nologo", "/c", "/Og", "/Oi", "/Ot", "/Oy", "/Ob1", "/Gs", "/Gy", "/G6", "/MT", "/DWIN32", "/D_WINDOWS", "/DTARGET_PC"]

# Genuine PCRE project defines; remaining compiler options are provisional.
c-pcre-import = ["/nologo", "/c", "/Og", "/Oi", "/Ot", "/Oy", "/Ob1", "/Gs", "/Gy", "/G6", "/MT", "/DWIN32", "/D_WINDOWS", "/DTARGET_PC", "/DPCRE_STATIC", "/DPOSIX_MALLOC_THRESHOLD=10"]

# Genuine PCRE project defines; remaining compiler options are provisional.
cpp-pcre-import = ["/nologo", "/c", "/Og", "/Oi", "/Ot", "/Oy", "/Ob1", "/Gs", "/Gy", "/G6", "/MT", "/GX", "/GR", "/DWIN32", "/D_WINDOWS", "/DTARGET_PC", "/DPCRE_STATIC", "/DPOSIX_MALLOC_THRESHOLD=10"]

